name: OpenAI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA | grep -E '\.(py|js|json|md)$' || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          # Properly format multiline output for GITHUB_OUTPUT
          {
            echo "DIFF<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate diff content
        id: diff-content
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}
          DIFF_CONTENT=""
          
          while IFS= read -r file; do
            if [ ! -z "$file" ] && [ -f "$file" ]; then
              echo "Processing $file"
              DIFF_CONTENT+="=== $file ===\n"
              DIFF_CONTENT+=$(git diff $BASE_SHA $HEAD_SHA -- "$file" || echo "Failed to diff $file")
              DIFF_CONTENT+="\n\n"
            fi
          done <<< "${{ steps.changed-files.outputs.DIFF }}"
          
          # Use proper multiline output syntax for GITHUB_OUTPUT
          {
            echo "CONTENT<<EOF"
            echo "$DIFF_CONTENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get OpenAI Review
        id: openai-review
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DIFF_CONTENT: ${{ steps.diff-content.outputs.CONTENT }}
        with:
          script: |
            const OpenAI = require('openai');
            const openai = new OpenAI({
              apiKey: process.env.OPENAI_API_KEY
            });
            
            const prompt = `Please review the following code changes for a Frappe app and provide a concise code review. Focus on:
            1. Potential bugs or issues
            2. Security concerns
            3. Performance implications
            4. Frappe best practices
            5. Suggestions for improvement

            Changes:
            ${process.env.DIFF_CONTENT}`;

            try {
              const completion = await openai.chat.completions.create({
                model: "gpt-4",
                messages: [{"role": "user", "content": prompt}],
                temperature: 0.7,
                max_tokens: 1000
              });

              const review = completion.choices[0].message.content;
              
              // Post review as PR comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `## 🤖 OpenAI Code Review

                ${review}

                ---
                *Note: This is an automated review. Please verify suggestions before implementing.*`
              });
            } catch (error) {
              core.setFailed(`OpenAI API Error: ${error.message}`);
            }

      - name: Handle errors
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ The automated code review process failed. Please check the workflow logs for details.'
            });
