name: Python Lint Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, development, main, master]

jobs:
  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff

      - name: Configure Flake8
        run: echo -e "[flake8]\nmax-line-length = 256\nindent-style = tab\ntab-size = 4" > .flake8

      - name: Run Ruff (Linting + Formatting)
        run: ruff check --select=E101 --fix .

      - name: Run Ruff (Linting + Formatting)
        run: ruff check --select=E101 --fix .

      - name: Fail on Lint Errors
        if: failure()
        run: exit 1
