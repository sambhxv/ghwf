name: OpenAI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ensures full git history so we have base and head commits

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Get diff of PR
        run: |
          echo "Fetching base branch: ${{ github.event.pull_request.base.ref }}"
          git fetch origin ${{ github.event.pull_request.base.ref }}
          echo "Generating diff between ${{ github.event.pull_request.base.sha }} and ${{ github.event.pull_request.head.sha }}"
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > diff.patch

      - name: Extract changed functions (Python only)
        run: |
          python - <<'EOF'
          import re

          diff_file = 'diff.patch'
          output_file = 'changed_functions.txt'
          try:
              with open(diff_file, 'r') as f:
                  diff_content = f.readlines()
          except Exception as e:
              print("Error reading diff file:", e)
              exit(1)

          function_lines = []
          # Naïve regex to detect added Python function definitions
          pattern = re.compile(r'^\+\s*def\s+')
          capture = False
          current_function = []
          for line in diff_content:
              if pattern.match(line):
                  if current_function:
                      function_lines.append("\n".join(current_function))
                      current_function = []
                  capture = True
                  # Remove the '+' that git adds to diff lines
                  current_function.append(line.lstrip('+').rstrip('\n'))
              elif capture:
                  if line.startswith('+'):
                      current_function.append(line.lstrip('+').rstrip('\n'))
                  else:
                      function_lines.append("\n".join(current_function))
                      current_function = []
                      capture = False
          if current_function:
              function_lines.append("\n".join(current_function))

          if not function_lines:
              print("No changed functions detected.")
          else:
              with open(output_file, 'w') as f:
                  for func in function_lines:
                      f.write(func + "\n\n")
              print(f"Extracted changed functions written to {output_file}")
          EOF

      - name: Run OpenAI Code Review
        run: |
          pip install openai
          python - <<'EOF'
          import os
          import openai
          import sys

          openai_api_key = os.environ.get('OPENAI_API_KEY')
          if not openai_api_key:
              print("OPENAI_API_KEY environment variable not set.")
              sys.exit(1)
          openai.api_key = openai_api_key

          try:
              with open('changed_functions.txt', 'r') as f:
                  changed_functions = f.read()
          except Exception as e:
              print("Error reading changed_functions.txt:", e)
              sys.exit(1)

          if not changed_functions.strip():
              print("No changed functions to review.")
              sys.exit(0)

          prompt = (
              "Please perform a code review for the following changed functions:\n\n"
              f"{changed_functions}\n\n"
              "Provide detailed feedback on potential issues, improvements, and best practices."
          )

          response = openai.ChatCompletion.create(
              model="gpt-3.5-turbo",
              messages=[
                  {
                      "role": "system", 
                      "content": "You are a senior code reviewer. Tell it like it is, don't sugar-coat responses."
                  },
                  {"role": "user", "content": prompt}
              ],
              temperature=0.2,
          )

          review = response['choices'][0]['message']['content']
          print("OpenAI Code Review:")
          print(review)

          # Save the review to a file so it can be posted as a PR comment.
          with open("code_review.txt", "w") as f:
              f.write(review)
          EOF
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Post Code Review as PR Comment
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('code_review.txt', { encoding: 'utf8' });
            if (!review || review.trim() === "") {
              console.log("No review content to post.");
              return;
            }
            const prNumber = context.payload.pull_request.number;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: review
            });
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
