name: Lint and Whitespaces Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Run Lint Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Flake8
        run: flake8 . --count --show-source --statistics

  whitespace:
    name: Check Whitespace Issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Trailing Whitespace
        run: |
          if git grep -n "[[:blank:]]$" -- "*.py" "*.js" "*.json"; then
            echo "Trailing whitespace found!" && exit 1;
          fi

      - name: Check for Tabs Instead of Spaces
        run: |
          if git grep -nP '\t' -- "*.py" "*.js" "*.json"; then
            echo "Tabs found instead of spaces!" && exit 1;
          fi

  prettier:
    name: Run Prettier on JS and JSON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Prettier
        run: npm install -g prettier

      - name: Check Formatting
        run: prettier --check "**/*.{js,json}"
