name: OpenAI Code Review
description: Review code changes using OpenAI
inputs:
  diff-content:
    description: "Content of code diff"
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "16"
    - name: Install dependencies
      run: npm install
      working-directory: review-code
    - name: Execute Code Review
      run: node review-code/index.js
